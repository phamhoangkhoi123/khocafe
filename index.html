
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoi - Quản lý kho</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5fa;color:#20283b;padding-bottom:90px}
header{background:white;padding:22px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e8ef}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:#5865e8;color:white;border-radius:17px;width:52px;height:52px;display:grid;place-items:center;font-size:25px;font-weight:bold}
h1{font-size:22px;margin:0}
.sub{font-size:13px;color:#8993a8;margin-top:4px}
button{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#5865e8;color:white}
.secondary{background:#edf0ff;color:#5865e8}
.danger{background:#fff0f0;color:#d94343}
main{padding:18px;max-width:700px;margin:auto}
.section{display:none}
.section.active{display:block}
.heading{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px}
.heading h2{font-size:21px;margin:0}
.muted{color:#8993a8}
.card{background:white;border:1px solid #e5e9f1;border-radius:22px;padding:18px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid #e8ebf1}
.item:last-child{border-bottom:0}
.emoji{width:48px;height:48px;border-radius:15px;background:#f2f4f9;display:grid;place-items:center;font-size:25px;flex-shrink:0}
.info{flex:1;min-width:0}
.info strong{font-size:17px}
.info small{display:block;color:#8993a8;margin-top:5px}
.amount{text-align:right;font-weight:bold;font-size:18px}
.amount small{display:block;color:#8993a8;font-weight:normal;margin-top:4px}
.item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.item-actions button{font-size:12px;padding:7px 10px}
.empty{text-align:center;padding:42px 15px;color:#8993a8}
.empty div{font-size:38px;margin-bottom:10px}
input,select{width:100%;padding:14px;border:1px solid #dce1eb;border-radius:12px;font-size:16px;margin:7px 0 15px;background:white;color:#20283b}
label{font-size:14px;font-weight:600}
.form-buttons{display:flex;gap:10px;margin-top:10px}
.form-buttons button{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:white;border:1px solid #e5e9f1;border-radius:18px;padding:18px}
.stat strong{font-size:25px;display:block;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e8ef;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:#8993a8;padding:8px 5px;font-size:12px}
nav button.active{color:#5865e8}
nav span{display:block;font-size:21px;margin-bottom:4px}
.alert{color:#d88a20;font-size:13px;margin-top:6px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.modal-content{background:white;border-radius:22px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal-content h2{margin-top:0}
body.dark{background:#151923;color:#f1f3f8}
body.dark header,body.dark nav,body.dark .card,body.dark .stat,body.dark .modal-content{background:#222938;color:#f1f3f8;border-color:#343d50}
body.dark input,body.dark select{background:#151923;color:white;border-color:#414b60}
body.dark .item{border-color:#343d50}
body.dark .emoji{background:#30394b}
body.dark .sub,body.dark .muted,body.dark .info small,body.dark .amount small{color:#aab4c7}
</style>
</head>
<body>

<header>
 <div class="brand">
  <div class="logo">K</div>
  <div><h1>KhoiStock</h1><div class="sub">QUẢN LÝ NGUYÊN LIỆU</div></div>
 </div>
 <button class="secondary" onclick="toggleDark()">☾</button>
</header>

<main>
 <section id="home" class="section active">
  <div class="heading"><h2>Tổng quan kho</h2></div>
  <div class="stats">
   <div class="stat">Tổng nguyên liệu<strong id="totalItems">0</strong></div>
   <div class="stat">Sắp hết hàng<strong id="lowItems">0</strong></div>
   <div class="stat">Tổng nhập<strong id="totalIn">0</strong></div>
   <div class="stat">Tổng xuất<strong id="totalOut">0</strong></div>
  </div>
  <div class="heading"><h2>Nguyên liệu cần chú ý</h2></div>
  <div class="card" id="lowList"></div>
 </section>

 <section id="stock" class="section">
  <div class="heading">
   <h2>Danh sách kho</h2>
   <span class="muted" id="count">0 mục</span>
  </div>
  <button class="primary" style="width:100%;margin-bottom:16px" onclick="openAdd()">＋ Thêm nguyên liệu</button>
  <input id="search" placeholder="Tìm nguyên liệu..." oninput="render()">
  <div class="card" id="inventory"></div>
 </section>

 <section id="history" class="section">
  <div class="heading"><h2>Lịch sử kho</h2></div>
  <div class="card" id="historyList"></div>
 </section>

 <section id="statistics" class="section">
  <div class="heading"><h2>Thống kê</h2></div>
  <div class="stats">
   <div class="stat">Số nguyên liệu<strong id="sItems">0</strong></div>
   <div class="stat">Sắp hết<strong id="sLow">0</strong></div>
   <div class="stat">Lượt nhập<strong id="sIn">0</strong></div>
   <div class="stat">Lượt xuất<strong id="sOut">0</strong></div>
  </div>
 </section>
</main>

<nav>
 <button class="active" onclick="showSection('home',this)"><span>⌂</span>Trang chủ</button>
 <button onclick="showSection('stock',this)"><span>▤</span>Kho hàng</button>
 <button onclick="showSection('history',this)"><span>◷</span>Lịch sử</button>
 <button onclick="showSection('statistics',this)"><span>▥</span>Thống kê</button>
</nav>

<div class="modal" id="modal">
 <div class="modal-content">
  <h2 id="modalTitle">Thêm nguyên liệu</h2>
  <div id="formArea"></div>
  <div class="form-buttons">
   <button class="secondary" onclick="closeModal()">Hủy</button>
   <button class="primary" onclick="saveForm()">Lưu</button>
  </div>
 </div>
</div>

<script>
const KEY="khoistock_data_v2";
let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"history":[]}');
let formType="add";
let selectedId=null;

function saveData(){
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
}

function showSection(id,btn){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function toggleDark(){document.body.classList.toggle("dark")}

function openAdd(){
 formType="add";
 document.getElementById("modalTitle").textContent="Thêm nguyên liệu";
 document.getElementById("formArea").innerHTML=`
 <label>Tên nguyên liệu</label><input id="fName" placeholder="Ví dụ: Cà phê">
 <label>Đơn vị</label><input id="fUnit" placeholder="Ví dụ: gói, hộp, kg">
 <label>Số lượng ban đầu</label><input id="fQty" type="number" min="0" value="0">
 <label>Ngưỡng cảnh báo</label><input id="fLimit" type="number" min="0" value="5">`;
 document.getElementById("modal").classList.add("show");
}

function openEdit(id){
 const item=data.items.find(x=>x.id===id);
 if(!item)return;
 formType="edit";selectedId=id;
 document.getElementById("modalTitle").textContent="Sửa nguyên liệu";
 document.getElementById("formArea").innerHTML=`
 <label>Tên nguyên liệu</label><input id="fName" value="${escapeHTML(item.name)}">
 <label>Đơn vị</label><input id="fUnit" value="${escapeHTML(item.unit)}">
 <label>Số lượng hiện tại</label><input id="fQty" type="number" min="0" value="${item.qty}">
 <label>Ngưỡng cảnh báo</label><input id="fLimit" type="number" min="0" value="${item.limit}">`;
 document.getElementById("modal").classList.add("show");
}

function openMove(id,type){
 const item=data.items.find(x=>x.id===id);
 if(!item)return;
 formType=type;selectedId=id;
 document.getElementById("modalTitle").textContent=type==="in"?"Nhập kho":"Xuất kho";
 document.getElementById("formArea").innerHTML=`
 <p><b>${escapeHTML(item.name)}</b> — Hiện có: ${item.qty} ${escapeHTML(item.unit)}</p>
 <label>Số lượng</label><input id="fQty" type="number" min="1" placeholder="Nhập số lượng">`;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}

function saveForm(){
 const qty=Number(document.getElementById("fQty").value);
 if(formType==="add"||formType==="edit"){
  const name=document.getElementById("fName").value.trim();
  const unit=document.getElementById("fUnit").value.trim();
  const limit=Number(document.getElementById("fLimit").value);
  if(!name||!unit||qty<0||limit<0){alert("Bà kiểm tra lại thông tin nhé!");return}
  if(formType==="add"){
   if(data.items.some(x=>x.name.toLowerCase()===name.toLowerCase())){alert("Nguyên liệu này đã có trong kho!");return}
   data.items.push({id:Date.now(),name,unit,qty,limit});
  }else{
   const item=data.items.find(x=>x.id===selectedId);
   if(item){item.name=name;item.unit=unit;item.qty=qty;item.limit=limit}
  }
 }else{
  const item=data.items.find(x=>x.id===selectedId);
  if(!item||!Number.isInteger(qty)||qty<=0){alert("Số lượng không hợp lệ!");return}
  if(formType==="out"&&qty>item.qty){alert("Kho không đủ số lượng để xuất!");return}
  item.qty+=formType==="in"?qty:-qty;
  data.history.unshift({name:item.name,type:formType,qty,unit:item.unit,date:new Date().toLocaleString("vi-VN")});
 }
 closeModal();saveData();
}

function deleteItem(id){
 const item=data.items.find(x=>x.id===id);
 if(!item)return;
 if(confirm('Bà có chắc muốn xóa "'+item.name+'"? Thao tác này không thể hoàn tác.')){
  data.items=data.items.filter(x=>x.id!==id);
  saveData();
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const filtered=data.items.filter(x=>x.name.toLowerCase().includes(q));
 document.getElementById("count").textContent=data.items.length+" mục";
 document.getElementById("inventory").innerHTML=filtered.length?filtered.map(x=>`
 <div class="item">
  <div class="emoji">📦</div>
  <div class="info">
   <strong>${escapeHTML(x.name)}</strong>
   <small>Ngưỡng cảnh báo: ${x.limit} ${escapeHTML(x.unit)}</small>
   ${x.qty<=x.limit?'<div class="alert">⚠ Sắp hết hàng</div>':''}
   <div class="item-actions">
    <button class="secondary" onclick="openMove(${x.id},'in')">＋ Nhập</button>
    <button class="secondary" onclick="openMove(${x.id},'out')">－ Xuất</button>
    <button class="secondary" onclick="openEdit(${x.id})">Sửa</button>
    <button class="danger" onclick="deleteItem(${x.id})">🗑 Xóa</button>
   </div>
  </div>
  <div class="amount">${x.qty}<small>${escapeHTML(x.unit)}</small></div>
 </div>`).join(""):'<div class="empty"><div>📦</div>Kho đang trống<br>Bấm “Thêm nguyên liệu” để bắt đầu nhé!</div>';

 const low=data.items.filter(x=>x.qty<=x.limit);
 document.getElementById("lowList").innerHTML=low.length?low.map(x=>`<p>⚠ ${escapeHTML(x.name)}: còn ${x.qty} ${escapeHTML(x.unit)}</p>`).join(""):'<div class="empty">Chưa có nguyên liệu cần cảnh báo</div>';

 document.getElementById("historyList").innerHTML=data.history.length?data.history.map(x=>`
 <div class="item"><div class="info"><strong>${escapeHTML(x.name)}</strong>
 <small>${x.type==="in"?"Nhập kho":"Xuất kho"} · ${escapeHTML(x.date)}</small></div>
 <div class="amount">${x.type==="in"?"+":"-"}${x.qty}<small>${escapeHTML(x.unit)}</small></div></div>`).join(""):'<div class="empty">Chưa có lịch sử nhập xuất</div>';

 const totalIn=data.history.filter(x=>x.type==="in").length;
 const totalOut=data.history.filter(x=>x.type==="out").length;
 const values={totalItems:data.items.length,lowItems:low.length,totalIn,totalOut,sItems:data.items.length,sLow:low.length,sIn:totalIn,sOut:totalOut};
 Object.entries(values).forEach(([id,value])=>document.getElementById(id).textContent=value);
}

render();
</script>
</body>
</html>
